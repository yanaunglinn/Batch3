<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=|, initial-scale=1.0">
    <title>DOM Exercise3</title>
</head>
<body>
     <div id="container">
        <p id="text">Original Heading</p>
    </div>
    <div>
        <button id="actionBtn"> Click Here</button>
    </div>
    <script>
        const actonBtn=document.getElementById('actionBtn');
        const container=document.getElementById('container');

        actonBtn.addEventListener('click', function(){
            const newParagraph = document.getElementById('text');
            newParagraph.textContent= "Hello,Javascript!";
            container.appendChild(newParagraph);
        });
    </script>
</body>
</html>
